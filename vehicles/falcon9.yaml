# Falcon 9 Block 5: vehicle definition (single source of truth).
# Consumed by tools/ (mass properties, URDF generation, Blender meshes).
# Units: SI. Frames: z up along the vehicle axis; each stage frame origin is at that
# stage's base plane on the axis. Vehicle frame origin = S1 base plane (bottom of the
# engine section skirt); the Merlin nozzle exits hang below it.
#
# Fidelity: "published" values come from public sources (Wikipedia Falcon 9 and
# SpaceX Merlin pages, fetched 2026-10-03). "estimate" values are engineering
# guesses chosen to be consistent with the published totals. They are NOT SpaceX data.
name: falcon9
display_name: Falcon 9 Block 5 (approximate public-data model)
sources:
  - https://en.wikipedia.org/wiki/Falcon_9
  - https://en.wikipedia.org/wiki/SpaceX_Merlin
reference:                      # published, used for validation only
  total_height: 69.8
  gross_liftoff_mass: 549000.0  # includes max payload, residuals, pressurants
  diameter: 3.7

propellant_densities:           # kg/m^3, densified (sub-cooled) propellants (estimate)
  lox: 1230.0
  rp1: 840.0

engine_models:
  merlin_1d:
    mass: 470.0                 # published
    length: 2.7                 # estimate (gimbal pivot to nozzle exit)
    exit_radius: 0.46           # published 0.92 m exit diameter
    thrust_sl: 845000.0          # published
    thrust_vac: 914000.0         # published stage 8,227 kN / 9
    isp_sl: 282.0               # published
    isp_vac: 311.0              # published
    gimbal_limit_deg: 5.0       # estimate (not published)
    throttle_min: 0.40          # estimate
  merlin_1d_vac:
    mass: 490.0                 # estimate
    length: 4.3                 # estimate (fits inside the interstage)
    exit_radius: 1.65           # published 3.3 m nozzle
    thrust_sl: 0.0              # not operated at sea level
    thrust_vac: 981000.0         # published
    isp_sl: 0.0
    isp_vac: 348.0              # published
    gimbal_limit_deg: 5.0       # estimate
    throttle_min: 0.39          # published

stages:
  - name: s1
    base_z: 0.0
    radius: 1.83
    length: 44.0                # base skirt to interstage top (estimate, see docs)
    dry_mass: 25600.0           # published, includes engines, legs, grid fins
    propellant_mass: 395700.0   # published
    mixture_ratio: 2.36         # O/F by mass (estimate, typical LOX/RP-1)
    sections:                   # stage-frame z ranges
      engine_section: [0.0, 2.0]
      rp1_tank: [2.0, 15.67]
      lox_tank: [15.67, 37.7]
      interstage: [37.7, 44.0]
    engines:
      model: merlin_1d
      layout: octaweb           # 1 centre + 8 on a ring
      count: 9
      ring_radius: 1.27         # estimate
      gimbal_z: 1.7             # pivot height in stage frame (exit at 1.7-2.7 = -1.0)
    grid_fins:
      count: 4
      mass_each: 300.0          # estimate (titanium, single-piece cast)
      azimuth0_deg: 0.0
      hinge_z: 42.2             # stowed folded up against the interstage
      radial_offset: 0.17       # hinge distance outside the skin
      width: 1.2                # estimate
      length: 1.5               # estimate
      depth: 0.3                # lattice depth (flow-through direction)
      deploy_deg: 90.0
      steer_limit_deg: 30.0     # estimate
    legs:
      count: 4
      mass_each: 525.0          # estimate (carbon fibre / Al honeycomb)
      azimuth0_deg: 0.0
      hinge_z: 2.5              # estimate
      radial_offset: 0.25
      length: 8.5               # estimate -> ~17.6 m deployed span
      deploy_deg: 125.0         # from stowed (pointing up) to 55 deg from vertical
    rcs:                        # nitrogen cold-gas thrusters (estimate): body torque limits [N m]
      max_torque: [40000.0, 40000.0, 10000.0]
  - name: s2
    base_z: 44.0                # sits on the interstage top
    radius: 1.83
    length: 11.7                # visible body; MVac hangs into the interstage
    dry_mass: 3900.0            # published, includes MVac
    propellant_mass: 92670.0    # published
    mixture_ratio: 2.36
    sections:
      rp1_tank: [0.3, 3.5]
      lox_tank: [3.5, 8.7]
      forward_structure: [8.7, 11.7]
    engines:
      model: merlin_1d_vac
      layout: single
      count: 1
      gimbal_z: 0.0

fairing:
  base_z: 55.7                  # vehicle frame (= S2 top)
  height: 13.1                  # published
  radius: 2.6                   # published 5.2 m diameter
  boattail_height: 1.2          # estimate (3.7 -> 5.2 m transition)
  cylinder_height: 6.1          # estimate
  mass: 1900.0                  # published (two halves)

payload:
  # Reference mission payload: NASA Mars 2020 flight system (Perseverance + Ingenuity).
  # Masses from https://en.wikipedia.org/wiki/Mars_2020 (fetched 2026-10-04). It actually flew
  # on an Atlas V 541; whether a (recoverable) Falcon 9 can send it to Mars is answered in Phase 4-5.
  type: mars2020
  name: Mars 2020 flight system (Perseverance + Ingenuity)
  base_z: 56.2                  # vehicle frame
  mass: 4060.5                  # published total launch mass
  components:                   # published; remainder (~410 kg) = adapters, fittings, misc.
    cruise_stage: 539.0
    backshell: 575.0
    heat_shield: 440.0
    descent_stage_fuelled: 1070.0
    perseverance_rover: 1025.0
    ingenuity_helicopter: 1.8
  size: [3.2, 3.2, 3.8]         # collision box; aeroshell is 4.5 m diameter (fits the 5.13 m fairing interior)

aero:                           # fidelity rung 1, all estimates (no public F9 aero data)
  reference_area: 21.24         # m^2, fairing cross-section (5.2 m)
  cp_z: 52.0                    # centre of pressure above S1 base (ahead of the CoM -> unstable, as real F9)
  cn_alpha: 2.0                 # per rad, slender-body normal-force slope
  cd_mach:                      # axial-force coefficient vs Mach (typical slender launch vehicle)
    - [0.0, 0.30]
    - [0.6, 0.30]
    - [0.9, 0.40]
    - [1.1, 0.55]
    - [1.3, 0.52]
    - [2.0, 0.40]
    - [3.0, 0.32]
    - [5.0, 0.25]
    - [10.0, 0.22]

aero_booster:                   # S1 alone after separation, flying engines-first (all estimates)
  reference_area: 10.52         # m^2, 3.66 m body
  cp_z: 30.0                    # with grid fins deployed the CP sits high -> weathervane-stable engines-first
  cn_alpha: 2.0
  cd_mach:                      # blunt engine section leading
    - [0.0, 0.85]
    - [0.8, 0.95]
    - [1.0, 1.25]
    - [1.2, 1.35]
    - [2.0, 1.20]
    - [3.0, 1.05]
    - [5.0, 0.95]
    - [10.0, 0.90]
  fin_cn_delta: 1.6             # per rad, per grid fin (estimate)
  fin_cd0: 0.9                  # grid-fin drag coefficient on its planform area

separation:                     # pneumatic pushers (estimate): ~0.5 m/s on the upper stage
  push_force: 100000.0
  push_duration: 0.5

avionics:                       # sensor models (navigation-grade CLASS values; not Falcon 9 data)
  imu:
    position: [0.0, 0.0, 40.5]  # vehicle frame, interstage avionics bay (estimate)
    rate_hz: 200
    gyro_bias_turn_on_deg_h: 0.01
    gyro_bias_rw_deg_h_rt_h: 0.003
    gyro_arw_deg_rt_h: 0.003
    gyro_scale_factor_ppm: 50
    accel_bias_turn_on_ug: 50
    accel_bias_rw_ug_rt_h: 10
    accel_vrw_m_s_rt_h: 0.005
    accel_scale_factor_ppm: 100
  gnss:
    antenna: [0.0, 0.0, 42.5]   # on the interstage (estimate)
    rate_hz: 10
    pos_white_m: 1.0
    pos_gm_m: 2.0               # first-order Gauss-Markov (atmospheric / ephemeris errors)
    pos_gm_tau_s: 100
    vel_white_m_s: 0.03
  alignment:                    # pre-launch attitude initialisation (ground alignment)
    tilt_sigma_deg: 0.005
    heading_sigma_deg: 0.05
  propellant_gauge:
    bias_frac: 0.003            # of full load
    noise_frac: 0.001
  thrust_sensor:                # from chamber pressure
    noise_frac: 0.01
